input {
  beats { port => 5044 }
}

filter {
  grok {
    match => {
      "message" => "%{IPORHOST:clientip} - - \[%{HTTPDATE:logtime}\] \"%{WORD:method} %{URIPATHPARAM:request} HTTP/%{NUMBER:httpversion}\" %{INT:status:int} %{INT:bytes:int} \"%{DATA:referrer}\" \"%{DATA:user_agent}\""
    }
  }
  date {
    match => [ "logtime", "dd/MMM/yyyy:HH:mm:ss Z" ]
    target => "@timestamp"
  }
  mutate {
    remove_field => ["logtime", "event", "ecs", "agent", "input", "host", "@version"]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "nginx-%{+YYYY.MM.dd}"
  }
  stdout { codec => rubydebug }
}
